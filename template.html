<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>國旗環遊世界</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff8ec; --bg-2:#ffffff;
  --ink:#2b2d42; --ink-2:#4a4e69; --ink-3:#8d8fa6; --ink-4:#d9d6cc;
  --accent:#ff7a1a;   /* 主強調：活力橘 */
  --accent-2:#1e88e5; /* 輔強調：天空藍 */
  --t1:55px; --t2:34px; --t3:21px; --t4:13px;
  --s1:80px; --s2:48px; --s3:24px; --s4:12px;
  --radius:22px;
  --shadow:0 10px 30px rgba(43,45,66,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;overflow:hidden}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}

/* ---------- 共用 UI ---------- */
#progress{position:fixed;top:0;left:0;height:4px;width:0;z-index:50;
  background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .45s ease}
#section-tag{position:fixed;top:16px;left:24px;z-index:40;font-size:var(--t4);font-weight:700;
  color:var(--ink-2);background:rgba(255,255,255,.85);padding:6px 14px;border-radius:999px;
  box-shadow:0 2px 8px rgba(0,0,0,.06);letter-spacing:.08em}
#pageInfo{position:fixed;right:24px;bottom:16px;z-index:40;font-size:var(--t4);color:var(--ink-2);
  background:rgba(255,255,255,.85);padding:3px 10px;border-radius:999px}
#hint{position:fixed;left:24px;bottom:16px;z-index:40;font-size:var(--t4);color:var(--ink-2);
  background:rgba(255,255,255,.85);padding:3px 10px;border-radius:999px}
#navbtns{position:fixed;right:24px;top:12px;z-index:40;display:flex;gap:8px}
#navbtns button{border:0;background:#fff;color:var(--ink-2);font:inherit;font-size:var(--t4);font-weight:700;
  padding:6px 12px;border-radius:999px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.08)}
#navbtns button:hover{color:var(--accent)}

.slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding:70px 90px 60px;opacity:0;pointer-events:none;transform:translateY(16px);
  transition:opacity .55s ease,transform .55s ease;overflow:hidden}
.slide.active{opacity:1;pointer-events:auto;transform:translateY(0)}
.slide-inner{width:100%;max-width:1320px}

.kicker{font-family:"JetBrains Mono","Noto Sans TC",monospace;font-size:var(--t4);font-weight:700;
  letter-spacing:.18em;color:var(--accent);text-transform:uppercase;margin-bottom:10px}
h1{font-size:clamp(40px,6vw,76px);font-weight:900;line-height:1.15}
h2{font-size:clamp(28px,3.4vw,var(--t1));font-weight:900;line-height:1.2;margin-bottom:var(--s3)}
h3{font-size:clamp(20px,2.2vw,var(--t2));font-weight:900;margin-bottom:8px}
p,li{font-size:clamp(16px,1.6vw,var(--t3));line-height:1.7;color:var(--ink-2)}
.hl{color:var(--accent)} .hl2{color:var(--accent-2)}

.card{background:var(--bg-2);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px}
.grid2{display:grid;grid-template-columns:1.05fr 1fr;gap:var(--s2);align-items:center}
.grid2.flip > :first-child{order:2}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s3)}

/* 老師問 */
.ask{margin-top:var(--s3);display:flex;gap:14px;align-items:flex-start;background:#fff3e6;
  border-left:6px solid var(--accent);border-radius:14px;padding:14px 18px}
.ask b{flex:none;font-size:var(--t4);background:var(--accent);color:#fff;border-radius:999px;padding:4px 12px;margin-top:4px}
.ask span{font-size:clamp(16px,1.6vw,var(--t3));font-weight:700;color:var(--ink)}

/* 教師備註（N 鍵切換） */
.note{display:none;position:absolute;left:50%;bottom:44px;transform:translateX(-50%);width:min(92%,1100px);
  background:#2b2d42;color:#fff;border-radius:14px;padding:12px 18px;font-size:15px;line-height:1.6;z-index:30}
.note::before{content:"教師備註　";color:var(--accent);font-weight:900}
body.show-notes .slide.active .note{display:block}

/* 封面／結尾 */
.full-bg{position:absolute;inset:0;background-size:cover;background-position:center}
.full-bg::after{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(255,248,236,.96) 0%,rgba(255,248,236,.85) 38%,rgba(255,248,236,0) 70%)}
.full-bg.top::after{background:linear-gradient(180deg,rgba(255,248,236,.95) 0%,rgba(255,248,236,.7) 35%,rgba(255,248,236,0) 65%)}
.cover-text{position:relative;z-index:2;max-width:620px}
.cover-text p{margin-top:var(--s3)}
.pill{display:inline-block;margin-top:var(--s3);font-size:var(--t4);font-weight:700;color:#fff;
  background:var(--accent-2);border-radius:999px;padding:6px 16px;margin-right:8px}

/* 旗子 */
.flag{display:block;width:100%;height:auto;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.18);
  border:1px solid rgba(0,0,0,.08);background:#fff}
.flag-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:34px}
.flag-card .flag{max-height:46vh;object-fit:contain}
.flag-name{text-align:center;margin-top:18px;font-size:var(--t2);font-weight:900}
.flag-name small{display:block;font-size:var(--t4);color:var(--ink-3);font-weight:500;letter-spacing:.1em}
.meaning{list-style:none;display:grid;gap:12px}
.meaning li{display:flex;gap:14px;align-items:flex-start;background:#fff;border-radius:14px;padding:12px 16px;
  box-shadow:0 3px 10px rgba(0,0,0,.05)}
.sw{flex:none;width:30px;height:30px;border-radius:8px;border:2px solid rgba(0,0,0,.12);margin-top:3px}
.meaning b{color:var(--ink)}

/* 猜猜看 */
.guess{cursor:pointer;text-align:center}
.guess .flag{transition:transform .25s}
.guess:hover .flag{transform:scale(1.04)}
.guess .ans{margin-top:16px;font-size:var(--t2);font-weight:900;color:var(--ink-4);transition:color .3s}
.guess.open .ans{color:var(--accent)}

/* 任務卡 */
.task{text-align:center}
.task .ico{font-size:56px;line-height:1;margin-bottom:12px}
.task h3{font-size:clamp(20px,2vw,28px)}

/* 地圖 */
.map{position:relative;width:100%;margin:0 auto;aspect-ratio:1280/644;border-radius:16px;overflow:hidden;box-shadow:var(--shadow);
  background-size:100% 100%}
.pin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;cursor:pointer;
  border:0;background:none;font:inherit}
.pin img{width:46px;border-radius:4px;box-shadow:0 2px 6px rgba(0,0,0,.4);border:2px solid #fff;transition:transform .2s}
.pin:hover img{transform:scale(1.25)}
.pin .lbl{margin-top:3px;font-size:12px;font-weight:900;color:#fff;background:rgba(43,45,66,.85);padding:1px 8px;border-radius:999px;white-space:nowrap}
.pin::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid #fff;margin-top:2px}
.pin.home::after{background:var(--accent-2)}
.pin.below{transform:translate(-50%,0);flex-direction:column-reverse}
.pin.below::after{margin:0 0 2px}
.pin.below .lbl{margin:0 0 3px}
.pin.here img{width:60px;outline:4px solid var(--accent)}
.pin.here .lbl{background:var(--accent)}
.pin.dim{opacity:.85}
.pulse{position:absolute;width:44px;height:44px;border-radius:50%;transform:translate(-50%,-50%);
  border:4px solid var(--accent);animation:pulse 1.6s ease-out infinite;pointer-events:none}
@keyframes pulse{0%{opacity:1;transform:translate(-50%,-50%) scale(.4)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.8)}}
.credit{font-size:11px;color:var(--ink-3);margin-top:6px}

/* 小檔案 */
.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:var(--s3)}
.fact{background:#fff;border-radius:14px;padding:12px 16px;box-shadow:0 3px 10px rgba(0,0,0,.05)}
.fact small{display:block;font-size:var(--t4);color:var(--ink-3);font-weight:700;letter-spacing:.1em}
.fact div{font-size:clamp(16px,1.7vw,22px);font-weight:900;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{background:#e8f2fd;color:var(--ink);border-radius:999px;padding:8px 16px;font-size:clamp(15px,1.4vw,18px);font-weight:700}
.dir{display:flex;gap:12px;align-items:center;background:#e8f2fd;border-radius:14px;padding:12px 16px;margin-bottom:var(--s3)}
.dir .arrow{font-size:34px}
.dir p{color:var(--ink);font-weight:700}

/* 名人 */
.person{text-align:center}
.avatar{width:min(140px,13vw);aspect-ratio:1/1;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;
  font-size:min(64px,6vw);background:linear-gradient(135deg,#fff3e6,#e8f2fd);border:4px solid #fff;box-shadow:var(--shadow)}
.person h3{font-size:clamp(20px,2vw,28px)}
.person .role{display:inline-block;font-size:var(--t4);font-weight:700;color:#fff;background:var(--accent-2);border-radius:999px;padding:3px 12px;margin-bottom:10px}
.person p{font-size:clamp(15px,1.45vw,19px)}

/* 比一比表格 */
table{width:100%;border-collapse:collapse;background:#fff;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
th,td{padding:9px 16px;text-align:left;border-bottom:1px solid #eee7da;font-size:clamp(14px,1.35vw,19px)}
th{background:#fff3e6;color:var(--ink);cursor:pointer;user-select:none;white-space:nowrap}
th:hover{color:var(--accent)}
th .s{color:var(--ink-3);font-size:12px;margin-left:4px}
td img{width:44px;vertical-align:middle;border-radius:3px;border:1px solid #ddd}
tr:last-child td{border-bottom:0}

/* 測驗 */
.quiz{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2);align-items:center}
.quiz .flag{max-height:33vh;object-fit:contain}
.opts{display:grid;gap:14px}
.opt{border:3px solid #eee7da;background:#fff;border-radius:16px;padding:16px 20px;font:inherit;font-size:clamp(18px,1.9vw,26px);
  font-weight:900;color:var(--ink);cursor:pointer;text-align:left;transition:all .2s}
.opt:hover{border-color:var(--accent-2)}
.opt.ok{background:#e3f6e8;border-color:#2e9e57;color:#1f7a42}
.opt.no{background:#fde8e8;border-color:#d64545;color:#b02c2c}
.qmeta{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.qmeta > span{font-size:var(--t3);font-weight:900}
.qbtn{border:0;background:var(--accent);color:#fff;font:inherit;font-weight:900;font-size:18px;border-radius:999px;padding:10px 22px;cursor:pointer}
.qbtn:disabled{opacity:.35;cursor:default}
.feedback{min-height:32px;font-size:clamp(16px,1.6vw,21px);font-weight:700;margin-top:6px}

/* CTA */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3);margin-top:var(--s3)}
.step{background:rgba(255,255,255,.93);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
.step .n{font-family:"JetBrains Mono",monospace;font-weight:700;color:#fff;background:var(--accent);
  width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:10px}

@media (max-width:900px){
  html,body{overflow:auto}
  .slide{padding:64px 18px 56px;align-items:flex-start;overflow-y:auto}
  .grid2,.quiz,.grid3,.grid4,.steps{grid-template-columns:1fr}
  .grid2.flip > :first-child{order:0}
  .grid4{grid-template-columns:1fr 1fr}
  .facts{grid-template-columns:1fr}
  #hint{display:none}
  .pin img{width:28px} .pin .lbl{font-size:10px}
  .avatar{width:96px;font-size:44px}
}
</style>
</head>

const slides = [...document.querySelectorAll('.slide')];
const MAP_PAGE = 3;
let cur = 0;
function go(n){
  n = Math.max(0, Math.min(slides.length-1, n));
  slides[cur].classList.remove('active'); cur = n; slides[cur].classList.add('active');
  document.getElementById('progress').style.width = ((cur+1)/slides.length*100)+'%';
  document.getElementById('pageInfo').textContent = `${cur+1} / ${slides.length}`;
  document.getElementById('section-tag').textContent = `— ${slides[cur].dataset.section} —`;
  try{ history.replaceState(null,'','#'+(cur+1)); }catch(e){}
}
document.addEventListener('keydown', e=>{
  if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(cur+1)}
  else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  else if(e.key==='Home') go(0); else if(e.key==='End') go(slides.length-1);
  else if(e.key==='f'||e.key==='F'){ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(()=>{}); }
  else if(e.key==='n'||e.key==='N') document.body.classList.toggle('show-notes');
  else if(e.key==='m'||e.key==='M') go(MAP_PAGE);
});
document.addEventListener('click', e=>{
  const pin = e.target.closest('.pin'); if(pin){ go(countryFirst[pin.dataset.go]); return; }
  if(e.target.closest('button,.guess,th,a,table,.opts,.map,#navbtns')) return;
  if(window.innerWidth <= 900) return;
  if(e.clientX > innerWidth*0.7) go(cur+1); else if(e.clientX < innerWidth*0.3) go(cur-1);
});
let tx=null; document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>60)go(cur+(dx<0?1:-1));tx=null});
document.querySelectorAll('.guess').forEach(g=>g.addEventListener('click',()=>g.classList.toggle('open')));
document.getElementById('btnMap').onclick = ()=>go(MAP_PAGE);

(function(){const t=document.getElementById('cmp');let dir={};t.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{

    const r=(!isNaN(nx)&&!isNaN(ny))?nx-ny:x.localeCompare(y,'zh-Hant');return dir[k]?r:-r});

    $('qfb').textContent='';$('qnext').disabled=true;$('qnext').textContent= qi===QUIZ.length-1?'看成績 →':'下一題 →';
    $('qopts').innerHTML=q.o.map(o=>`<button class="opt">${o}</button>`).join('');
    $('qopts').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(done)return;done=true;
      const ok=b.textContent===q.a; if(ok)score++; b.classList.add(ok?'ok':'no');
      if(!ok)[...$('qopts').children].find(x=>x.textContent===q.a).classList.add('ok');
      $('qfb').innerHTML= ok?'🎉 答對了！':`再想想～答案是 <b>${q.a}</b>`; $('qfb').style.color= ok?'#1f7a42':'#b02c2c';
      $('qscore').textContent=`${score} / ${QUIZ.length}`;$('qnext').disabled=false;});}
  $('qnext').onclick=()=>{if(qi<QUIZ.length-1){qi++;show();}else{$('qopts').innerHTML='';$('qflag').innerHTML='<div style="font-size:96px;text-align:center">🏆</div>';
    $('qno').textContent='闖關完成！';$('qfb').style.color='var(--ink)';$('qfb').innerHTML=`你答對了 <b class="hl">${score}</b> 題，共 ${QUIZ.length} 題！`;$('qnext').disabled=true;}};
  $('qreset').onclick=()=>{qi=0;score=0;$('qscore').textContent=`0 / ${QUIZ.length}`;show();};
  show();})();

const start = parseInt((location.hash||'').slice(1));
slides[0].classList.add('active'); go(isNaN(start)?0:start-1);
</script>
