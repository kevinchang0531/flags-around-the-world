<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>世界國旗探索</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff8ec; --card:#ffffff; --ink:#2b2d42; --ink-2:#4a4e69; --ink-3:#8d8fa6; --line:#eee7da;
  --accent:#ff7a1a; --accent-2:#1e88e5; --ok:#2e9e57; --no:#d64545;
  --sea:#cfe8f7; --land:#f4ead2;
  --c-asia:#ffb36b; --c-europe:#7fb7f0; --c-africa:#f5d36b; --c-na:#8fd19e; --c-sa:#c9a4e8; --c-oc:#f59bb5;
  --radius:18px; --shadow:0 8px 24px rgba(43,45,66,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
button{font:inherit;cursor:pointer}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}

/* 頂部 */
header{position:sticky;top:0;z-index:20;background:rgba(255,248,236,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:1400px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-weight:900;font-size:22px;white-space:nowrap}
.logo span{color:var(--accent)}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap}
nav.tabs button{border:0;background:#fff;border-radius:999px;padding:8px 16px;font-weight:700;color:var(--ink-2);box-shadow:0 2px 6px rgba(0,0,0,.06)}
nav.tabs button.on{background:var(--accent);color:#fff}
.bar .sp{flex:1}
.tool{border:0;background:var(--accent-2);color:#fff;border-radius:999px;padding:8px 16px;font-weight:700}
.tool.ghost{background:#fff;color:var(--ink-2);box-shadow:0 2px 6px rgba(0,0,0,.06)}
a.tool{text-decoration:none;display:inline-block}

main{max-width:1400px;margin:0 auto;padding:16px}
.view{display:none}.view.on{display:block}

/* 篩選列 */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.filters .lbl{font-size:13px;font-weight:700;color:var(--ink-3);margin-right:2px}
.chip{border:2px solid transparent;background:#fff;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700;color:var(--ink-2);box-shadow:0 1px 4px rgba(0,0,0,.06)}
.chip.on{border-color:var(--accent);color:var(--accent)}
.chip .dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:1px solid rgba(0,0,0,.15)}
input[type=search]{border:2px solid var(--line);border-radius:999px;padding:8px 16px;font:inherit;font-size:16px;min-width:220px;background:#fff}
input[type=search]:focus{outline:none;border-color:var(--accent-2)}
select{border:2px solid var(--line);border-radius:999px;padding:6px 12px;font:inherit;background:#fff}
.count{font-weight:900;color:var(--accent-2)}

/* 地圖 */
.mapwrap{position:relative;background:var(--sea);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.mapwrap svg{display:block;width:100%;height:auto;max-height:calc(100vh - 190px);cursor:grab;touch-action:none}
.mapwrap svg:active{cursor:grabbing}
.country{stroke:#fff;stroke-width:.6;vector-effect:non-scaling-stroke;transition:opacity .2s}
.country.ours{cursor:pointer}
.country.ours:hover,.marker:hover{fill:var(--accent)!important}
.country.dim,.marker.dim{opacity:.18}
.country.hit{fill:var(--ok)!important}.country.miss{fill:var(--no)!important}
.country.target{fill:var(--accent)!important;animation:blink 1s ease-in-out infinite}
@keyframes blink{50%{opacity:.4}}
.marker{stroke:#fff;stroke-width:1;vector-effect:non-scaling-stroke;cursor:pointer}
.mapctl{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:38px;height:38px;border:0;border-radius:10px;background:#fff;font-size:20px;font-weight:900;box-shadow:var(--shadow)}
.legend{position:absolute;left:12px;bottom:12px;background:rgba(255,255,255,.9);border-radius:12px;padding:8px 12px;font-size:12px;display:flex;flex-wrap:wrap;gap:8px;max-width:70%}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
#tip{position:fixed;pointer-events:none;z-index:60;background:#2b2d42;color:#fff;border-radius:10px;padding:6px 10px;font-size:14px;font-weight:700;display:none;align-items:center;gap:8px;white-space:nowrap}
#tip img{width:36px;border-radius:3px}
.hint{font-size:13px;color:var(--ink-3);margin-top:8px}

/* 國旗牆 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.fcard{background:#fff;border:0;border-radius:14px;padding:12px;box-shadow:0 3px 10px rgba(0,0,0,.06);text-align:center;transition:transform .15s}
.fcard:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.fcard .fw{aspect-ratio:3/2;display:flex;align-items:center;justify-content:center}
.fcard img{max-width:100%;max-height:100%;border:1px solid rgba(0,0,0,.08);border-radius:4px}
.fcard b{display:block;margin-top:8px;font-size:16px}
.fcard small{display:block;font-size:11px;color:var(--ink-3)}
.fcard.hide-name b,.fcard.hide-name small{visibility:hidden}

/* 詳細卡 */
#detail{position:fixed;inset:0;z-index:50;background:rgba(43,45,66,.55);display:none;align-items:center;justify-content:center;padding:16px}
#detail.on{display:flex}
.dbox{position:relative;background:var(--bg);border-radius:24px;width:min(1280px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:28px 32px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.dtop{position:sticky;top:-28px;margin:-28px -32px 16px;padding:12px 20px;background:var(--bg);display:flex;gap:8px;align-items:center;z-index:3;border-bottom:1px solid var(--line)}
.dtop .pos{font-size:13px;color:var(--ink-3);margin-right:auto}
.dtop button{white-space:nowrap;border:0;background:#fff;border-radius:999px;padding:6px 14px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.dgrid{display:grid;grid-template-columns:1fr 1.15fr;gap:28px;align-items:start}
.flagbox{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}
.flagbox img.big{width:100%;max-height:42vh;object-fit:contain;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.15);background:#fff}
.flagbox h4{margin:16px 0 8px;font-size:15px;color:var(--accent);letter-spacing:.1em}
.meaning{list-style:none;display:grid;gap:8px}
.meaning li{background:var(--bg);border-radius:10px;padding:8px 12px;font-size:16px;line-height:1.6;color:var(--ink-2)}
.meaning b{color:var(--ink)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tags span{font-size:12px;background:#e8f2fd;border-radius:999px;padding:3px 10px;font-weight:700;color:var(--ink-2)}
.dname{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.dname h2{font-size:clamp(32px,4vw,52px);font-weight:900;line-height:1.1}
.dname small{color:var(--ink-3);font-weight:700;letter-spacing:.1em}
.dfull{color:var(--ink-3);margin:4px 0 14px}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.fact{background:#fff;border-radius:12px;padding:10px 14px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.fact small{display:block;font-size:12px;color:var(--ink-3);font-weight:700}
.fact div{font-size:17px;font-weight:900}
.intro{font-size:18px;line-height:1.8;color:var(--ink-2);margin-bottom:12px}
.feats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.feats span{background:#fff3e6;border-radius:999px;padding:6px 14px;font-weight:700}
.locrow{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.globe{width:220px;height:220px;cursor:grab;touch-action:none}
.globe .sphere{fill:var(--sea)} .globe .land{fill:var(--land);stroke:#fff;stroke-width:.4} .globe .me{fill:var(--accent)} .globe .tw{fill:var(--accent-2)}
.globe .grat{fill:none;stroke:#fff;stroke-width:.4;opacity:.7}
.dirbox{background:#e8f2fd;border-radius:14px;padding:12px 16px;font-size:16px;line-height:1.7}
.dirbox b{color:var(--accent-2)}
.sec-h{font-size:22px;font-weight:900;margin:22px 0 12px}
.sec-h span{color:var(--accent)}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.person{background:#fff;border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);text-align:center}
.avatar{width:84px;height:84px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:42px;background:linear-gradient(135deg,#fff3e6,#e8f2fd);border:3px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.person h5{font-size:20px;font-weight:900}
.person .role{display:inline-block;font-size:12px;font-weight:700;color:#fff;background:var(--accent-2);border-radius:999px;padding:2px 10px;margin:4px 0 8px}
.person p{font-size:15px;line-height:1.6;color:var(--ink-2)}
.askrow{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.ask{display:flex;gap:12px;align-items:flex-start;background:#fff3e6;border-left:6px solid var(--accent);border-radius:14px;padding:12px 16px}
.ask b{flex:none;font-size:13px;background:var(--accent);color:#fff;border-radius:999px;padding:3px 10px;margin-top:3px}
.ask span{font-size:17px;font-weight:700;line-height:1.6}
.ask.fun{background:#e8f2fd;border-color:var(--accent-2)} .ask.fun b{background:var(--accent-2)}
.disc{font-size:12px;color:var(--ink-3);margin-top:16px}

/* 遊戲 */
.gamepick{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-bottom:16px}
.gcard{border:3px solid transparent;background:#fff;border-radius:var(--radius);padding:20px;text-align:left;box-shadow:var(--shadow)}
.gcard.on{border-color:var(--accent)}
.gcard .ico{font-size:40px}.gcard h3{font-size:20px;margin:6px 0 4px}.gcard p{font-size:14px;color:var(--ink-2)}
.gamebox{background:#fff;border-radius:24px;box-shadow:var(--shadow);padding:24px;min-height:420px}
.ghead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.ghead .score{margin-left:auto;font-size:20px;font-weight:900}
.ghead .score em{font-style:normal;color:var(--accent)}
.qarea{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center}
.qflag{width:100%;max-height:46vh;object-fit:contain;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.18);border:1px solid rgba(0,0,0,.06)}
.qtitle{font-size:clamp(28px,4vw,48px);font-weight:900;text-align:center}
.opts{display:grid;gap:12px}
.opts.flags{grid-template-columns:1fr 1fr}
.opt{border:3px solid var(--line);background:#fff;border-radius:16px;padding:14px 18px;font-size:clamp(18px,2vw,26px);font-weight:900;color:var(--ink);text-align:left;transition:all .15s}
.opt:hover{border-color:var(--accent-2)}
.opt img{width:100%;aspect-ratio:3/2;object-fit:contain;display:block}
.opt.ok{background:#e3f6e8;border-color:var(--ok);color:#1f7a42}
.opt.no{background:#fde8e8;border-color:var(--no);color:#b02c2c}
.fb{min-height:34px;font-size:20px;font-weight:900;margin-top:12px}
.fb.ok{color:var(--ok)}.fb.no{color:var(--no)}
.gbtn{border:0;background:var(--accent);color:#fff;border-radius:999px;padding:10px 22px;font-weight:900;font-size:17px}
.gbtn.blue{background:var(--accent-2)}
.gbtn:disabled{opacity:.35;cursor:default}
.findq{font-size:clamp(22px,3vw,34px);font-weight:900;margin-bottom:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.findq img{height:46px;border-radius:4px;border:1px solid #ddd}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;perspective:800px}
.mcard{position:relative;aspect-ratio:4/3;border:0;background:none;padding:0}
.mcard .in{position:absolute;inset:0;transition:transform .45s;transform-style:preserve-3d}
.mcard.flip .in,.mcard.done .in{transform:rotateY(180deg)}
.mcard .f,.mcard .b{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,.1)}
.mcard .f{background:linear-gradient(135deg,var(--accent),#ffb36b);color:#fff;font-size:34px;font-weight:900}
.mcard .b{background:#fff;transform:rotateY(180deg);padding:10px;font-size:clamp(16px,2vw,24px);font-weight:900}
.mcard .b img{max-width:100%;max-height:100%;border:1px solid #ddd;border-radius:4px}
.mcard.done .b{outline:4px solid var(--ok)}
.end{text-align:center;padding:40px 0}
.end .big{font-size:80px}

/* 抽籤 */
#roll{position:fixed;inset:0;z-index:55;background:rgba(43,45,66,.7);display:none;align-items:center;justify-content:center;flex-direction:column;gap:18px}
#roll.on{display:flex}
#roll img{width:min(520px,80vw);border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.4);background:#fff}
#roll b{color:#fff;font-size:40px;font-weight:900}

@media (max-width:900px){
  .dgrid,.qarea,.askrow{grid-template-columns:1fr}
  .dbox{padding:20px}.dtop{margin:-20px -20px 12px;top:-20px;justify-content:flex-end}
  .dtop .pos{display:none} .dtop button{padding:6px 10px;font-size:14px}
  .locrow{grid-template-columns:1fr}.globe{margin:0 auto}
  .mem{grid-template-columns:repeat(3,1fr)}
  .grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
  .legend{display:none}
}
</style>
</head>
<body>
<header><div class="bar">
  <div class="logo">🌍 世界國旗<span>探索</span></div>
  <nav class="tabs">
    <button data-v="map" class="on">🗺️ 世界地圖</button>
    <button data-v="wall">🚩 國旗牆</button>
    <button data-v="game">🎮 遊戲</button>
  </nav>
  <span class="sp"></span>
  <button class="tool" id="btnRandom">🎲 隨機抽一國</button>
  <button class="tool ghost" id="btnFull">⛶ 全螢幕</button>
</div></header>

<main>
  <!-- 地圖 -->
  <section class="view on" id="v-map">
    <div class="filters" id="mapFilters"><span class="lbl">看哪一洲：</span></div>
    <div class="mapwrap" id="mainMap"></div>
    <p class="hint">滑鼠移到國家上看國名，點一下看介紹；滾輪或按 ＋／－ 放大縮小，拖曳可以移動。小島國用圓點表示。</p>
  </section>

  <!-- 國旗牆 -->
  <section class="view" id="v-wall">
    <div class="filters">
      <input type="search" id="q" placeholder="🔍 搜尋國家（中文或英文）">
      <select id="sort"><option value="cont">依洲排列</option><option value="name">依國名筆畫</option><option value="area-d">面積大→小</option><option value="area-a">面積小→大</option><option value="dist">離台灣近→遠</option></select>
      <button class="chip" id="hideNames">🙈 遮住國名</button>
      <span class="sp"></span>找到 <span class="count" id="cnt">0</span> 國
    </div>
    <div class="filters" id="contFilters"><span class="lbl">洲：</span></div>
    <div class="filters" id="colorFilters"><span class="lbl">國旗有這些顏色：</span></div>
    <div class="filters" id="symFilters"><span class="lbl">國旗上有：</span></div>
    <div class="grid" id="grid"></div>
  </section>

  <!-- 遊戲 -->
  <section class="view" id="v-game">
    <div class="gamepick">
      <button class="gcard on" data-g="flag2name"><div class="ico">🚩➡️🔤</div><h3>看國旗猜國家</h3><p>看國旗，從 4 個國名選出正確答案。</p></button>
      <button class="gcard" data-g="name2flag"><div class="ico">🔤➡️🚩</div><h3>看國名找國旗</h3><p>看國名，從 4 面國旗選出正確的一面。</p></button>
      <button class="gcard" data-g="find"><div class="ico">📍</div><h3>地圖找國家</h3><p>在世界地圖上點出題目的國家在哪裡。</p></button>
      <button class="gcard" data-g="memory"><div class="ico">🃏</div><h3>國旗翻牌配對</h3><p>翻開卡片，把國旗和國名配成一對。</p></button>
    </div>
    <div class="gamebox">
      <div class="ghead">
        <span class="lbl" style="font-weight:700;color:var(--ink-3)">範圍：</span>
        <select id="gScope"></select>
        <select id="gLevel"><option value="easy">簡單（大國）</option><option value="mid" selected>普通</option><option value="all">挑戰（全部國家）</option></select>
        <button class="gbtn blue" id="gStart">開始 / 重來</button>
        <div class="score" id="gScore"></div>
      </div>
      <div id="gArea"></div>
    </div>
  </section>
</main>
<footer style="max-width:1400px;margin:0 auto;padding:8px 16px 24px;font-size:12px;color:var(--ink-3);line-height:1.7">
  國旗：flagcdn.com（公有領域）｜國家資料：mledoze/countries（ODbL）｜地圖：Natural Earth（公有領域）｜國家介紹由 AI 協助整理，上課前建議老師再確認。
</footer>

<div id="detail"><div class="dbox" id="dbox"></div></div>
<div id="roll"><img id="rollImg" alt=""><b id="rollName"></b></div>
<div id="tip"></div>

<script src="lib/d3.min.js"></script>
<script src="lib/topojson-client.min.js"></script>
<script src="data/world.js"></script>
<script src="data/countries.js"></script>
<script>
/* ========= 資料 ========= */
const CONTS = [
  {k:"亞洲",c:"var(--c-asia)",hex:"#ffb36b"},{k:"歐洲",c:"var(--c-europe)",hex:"#7fb7f0"},{k:"非洲",c:"var(--c-africa)",hex:"#f5d36b"},
  {k:"北美洲",c:"var(--c-na)",hex:"#8fd19e"},{k:"南美洲",c:"var(--c-sa)",hex:"#c9a4e8"},{k:"大洋洲",c:"var(--c-oc)",hex:"#f59bb5"}];
const CONT_HEX = Object.fromEntries(CONTS.map(c=>[c.k,c.hex]));
const COLORS = [["紅","#e53935"],["白","#ffffff"],["藍","#1e5bd8"],["綠","#2e9e57"],["黃","#f5c518"],["黑","#222"],["橘","#ff8c1a"],["其他","linear-gradient(135deg,#8e44ad,#8d6e63)"]];
const SYMS = ["星星","太陽","月亮","十字","動物","植物","武器","文字","徽章","三角形","圓形","橫條紋","直條紋"];
const TW = {lat:25.03, lon:121.56}, TW_AREA = 36193;
const flagSrc = id => `flags/${id}.svg`;
const byId = Object.fromEntries(COUNTRIES.map(c=>[c.id,c]));

function haversine(a,b){const R=6371,r=Math.PI/180;const dLat=(b.lat-a.lat)*r,dLon=(b.lon-a.lon)*r;
  const h=Math.sin(dLat/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
COUNTRIES.forEach(c=>{ c.dist = c.id==="tw"?0:haversine(TW,{lat:c.latlng[0],lon:c.latlng[1]}); });
function direction(c){
  if(c.id==="tw") return "就是我們住的地方！";
  let dLon=c.latlng[1]-TW.lon; dLon=((dLon+540)%360)-180; const dLat=c.latlng[0]-TW.lat;
  if(Math.abs(dLon)>150) return "在地球的另一邊";
  const ang=Math.atan2(dLat,dLon)*180/Math.PI; // 0=東
  const dirs=["東","東北","北","西北","西","西南","南","東南"];
  return "在台灣的"+dirs[((Math.round(ang/45)%8)+8)%8]+"方";
}
function areaText(a){
  if(!a) return "—";
  const km = a>=10000? Math.round(a/1000)*1000 : Math.round(a);
  const r = a/TW_AREA; let cmp;
  if(Math.abs(r-1)<.15) cmp="和台灣差不多大";
  else if(r>1) cmp=`大約是台灣的 ${r>=10?Math.round(r):r.toFixed(1)} 倍`;
  else cmp = r>=0.01? `大約是台灣的 ${Math.max(1,Math.round(r*100))}%` : "比台北市還小";
  return {km:km.toLocaleString(), cmp};
}
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; };

const FEAT = topojson.feature(WORLD, WORLD.objects.countries).features;
function makeMap(el,{onClick,hover=true,showMarkers=true}={}){
  const W=1000,H=520;
  const proj=d3.geoNaturalEarth1().fitExtent([[6,6],[W-6,H-6]],{type:"Sphere"});
  const path=d3.geoPath(proj);
  const svg=d3.select(el).append('svg').attr('viewBox',`0 0 ${W} ${H}`);
  const g=svg.append('g');
  g.append('path').datum({type:"Sphere"}).attr('d',path).attr('fill','var(--sea)');
  g.append('path').datum(d3.geoGraticule10()).attr('d',path).attr('fill','none').attr('stroke','#fff').attr('stroke-width',.4).attr('opacity',.6).attr('vector-effect','non-scaling-stroke');
  const paths=g.selectAll('path.country').data(FEAT).join('path')
    .attr('class',d=>'country'+(byId[d.id]?' ours':'')).attr('d',path)
    .attr('fill',d=>byId[d.id]?CONT_HEX[byId[d.id].cont]:'#e6e0d0');
  const small = COUNTRIES.filter(c=>{const f=FEAT.find(x=>x.id===c.id);return !f || path.area(f)<6;});
  const markers=g.selectAll('circle.marker').data(showMarkers?small:[]).join('circle').attr('class','marker')
    .attr('r',3.2).attr('fill',c=>CONT_HEX[c.cont])
    .attr('cx',c=>proj([c.latlng[1],c.latlng[0]])[0]).attr('cy',c=>proj([c.latlng[1],c.latlng[0]])[1]);
  const cOf = d => d.zh ? d : byId[d.id];
  function bind(sel){
    sel.on('mousemove',(e,d)=>{const c=cOf(d); if(c&&hover) showTip(e,c); })
       .on('mouseleave',hideTip)
       .on('click',(e,d)=>{const c=cOf(d); if(c&&onClick) onClick(c,e);});
  }
  bind(paths); bind(markers);
  const zoom=d3.zoom().scaleExtent([1,14]).translateExtent([[0,0],[W,H]]).on('zoom',e=>{
    g.attr('transform',e.transform); markers.attr('r',3.2/Math.sqrt(e.transform.k)); });
  svg.call(zoom).on('dblclick.zoom',null);
  const ctl=document.createElement('div'); ctl.className='mapctl';
  ctl.innerHTML='<button title="放大">＋</button><button title="縮小">－</button><button title="重置">⟲</button>';
  const [bi,bo,br]=ctl.children;
  bi.onclick=()=>svg.transition().call(zoom.scaleBy,1.6); bo.onclick=()=>svg.transition().call(zoom.scaleBy,1/1.6);
  br.onclick=()=>svg.transition().call(zoom.transform,d3.zoomIdentity);
  el.appendChild(ctl);
  const lg=document.createElement('div'); lg.className='legend';
  lg.innerHTML=CONTS.map(c=>`<span><i style="background:${c.hex}"></i>${c.k}</span>`).join('');
  el.appendChild(lg);
  return {
    paths, markers,
    dim(cont){ paths.classed('dim',d=>cont&&byId[d.id]&&byId[d.id].cont!==cont); markers.classed('dim',c=>cont&&c.cont!==cont); },
    mark(id,cls){ paths.filter(d=>d.id===id).classed(cls,true); markers.filter(c=>c.id===id).attr('r',7).classed(cls,true).attr('fill',cls==='hit'?'var(--ok)':cls==='miss'?'var(--no)':'var(--accent)'); },
    clear(){ paths.classed('hit miss target',false); markers.classed('hit miss target',false).attr('fill',c=>CONT_HEX[c.cont]).attr('r',3.2); },
    zoomTo(c){ const f=FEAT.find(x=>x.id===c.id); let [[x0,y0],[x1,y1]]= f? path.bounds(f) : (()=>{const p=proj([c.latlng[1],c.latlng[0]]);return [[p[0]-20,p[1]-20],[p[0]+20,p[1]+20]]})();
      const k=Math.min(8,0.5/Math.max((x1-x0)/W,(y1-y0)/H)); const tx=W/2-k*(x0+x1)/2, ty=H/2-k*(y0+y1)/2;
      svg.transition().duration(800).call(zoom.transform,d3.zoomIdentity.translate(tx,ty).scale(Math.max(1,k))); },
    reset(){ svg.call(zoom.transform,d3.zoomIdentity); }
  };
}

  function redraw(){ svg.selectAll('path').attr('d',path);
    const vis=(lon,lat)=>d3.geoDistance([lon,lat],[-proj.rotate()[0],-proj.rotate()[1]])<Math.PI/2;
    const p=proj([c.latlng[1],c.latlng[0]]); pt.attr('cx',p[0]).attr('cy',p[1]).attr('opacity',vis(c.latlng[1],c.latlng[0])?1:0);

  redraw();
  svg.call(d3.drag().on('drag',e=>{const r=proj.rotate();proj.rotate([r[0]+e.dx*.6,Math.max(-80,Math.min(80,r[1]-e.dy*.6))]);redraw();}));
}

function gamePool(){
  const scope=document.getElementById('gScope').value, lv=document.getElementById('gLevel').value;
  let P = COUNTRIES.filter(c=>!scope||c.cont===scope);
  const min = lv==="easy"?600000: lv==="mid"?60000:0;
  let Q = P.filter(c=>c.area>=min || c.id==="tw");
  if(Q.length<8) Q=[...P].sort((a,b)=>b.area-a.area).slice(0,Math.min(P.length,12));
  return {pool:Q, all:P};
}
const gArea = () => document.getElementById('gArea');

function startGame(){
  gameState.started=true; const {pool,all}=gamePool();
  if(gameState.type==="memory") return memoryGame(pool);
  if(gameState.type==="find") return findGame(pool);

}
function distractors(ans,all,n=3){
  const same = shuffle(all.filter(c=>c.id!==ans.id && c.cont===ans.cont));
  const other = shuffle(COUNTRIES.filter(c=>c.id!==ans.id && c.cont!==ans.cont));
  return same.concat(other).slice(0,n);
}
function endScreen(score,total,again){
  const pct=score/total, msg= pct===1?"太厲害了！全部答對！":pct>=.7?"很棒！你是國旗小達人！":pct>=.4?"不錯喔，再挑戰一次！":"多看看國旗牆，再來挑戰！";
  gArea().innerHTML=`<div class="end"><div class="big">${pct===1?"🏆":pct>=.7?"🥇":pct>=.4?"👍":"💪"}</div><h2 style="font-size:36px;margin:10px 0">答對 <span style="color:var(--accent)">${score}</span> / ${total} 題</h2><p style="font-size:20px;color:var(--ink-2)">${msg}</p><button class="gbtn" style="margin-top:20px" id="again">再玩一次</button></div>`;
  document.getElementById('again').onclick=again;
}
function quizGame(pool,all,type){
  const N=Math.min(10,pool.length), Qs=shuffle(pool).slice(0,N); let i=0,score=0,streak=0;
  function show(){
    const ans=Qs[i], opts=shuffle([ans,...distractors(ans,all)]); let done=false;
    setScore(`第 <em>${i+1}</em>/${N} 題　得分 <em>${score}</em>${streak>=3?`　🔥 連對 ${streak}`:""}`);

      ? `<div class="qarea"><img class="qflag" src="${flagSrc(ans.id)}" alt="猜猜這是哪一國的國旗"><div><p style="font-size:20px;font-weight:900;margin-bottom:10px">這是哪一國的國旗？</p><div class="opts">${opts.map(o=>`<button class="opt" data-id="${o.id}">${esc(o.zh)}</button>`).join('')}</div><div class="fb" id="fb"></div><button class="gbtn" id="nx" disabled>下一題 →</button></div></div>`
      : `<div><div class="qtitle">哪一面是 <span style="color:var(--accent)">${esc(ans.zh)}</span> 的國旗？</div><div class="opts flags" style="max-width:820px;margin:20px auto 0">${opts.map(o=>`<button class="opt" data-id="${o.id}"><img src="${flagSrc(o.id)}" alt="選項國旗"></button>`).join('')}</div><div style="text-align:center"><div class="fb" id="fb"></div><button class="gbtn" id="nx" disabled>下一題 →</button></div></div>`;
    gArea().querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ if(done)return; done=true;
      const ok=b.dataset.id===ans.id; if(ok){score++;streak++;}else streak=0;
      b.classList.add(ok?'ok':'no'); gArea().querySelector(`.opt[data-id="${ans.id}"]`).classList.add('ok');
      const fb=document.getElementById('fb'); fb.className='fb '+(ok?'ok':'no');
      fb.innerHTML = ok? `🎉 答對了！${streak>=3?`連續答對 ${streak} 題！`:""}` : `再想想～答案是 ${esc(ans.zh)}${type==="name2flag"?`（你選的是 ${esc(byId[b.dataset.id].zh)}）`:""}`;
      fb.innerHTML += ` <a href="#" id="more" style="font-size:15px;color:var(--accent-2)">認識${esc(ans.zh)} →</a>`;
      document.getElementById('more').onclick=e=>{e.preventDefault();openDetail(ans.id,[ans]);};
      setScore(`第 <em>${i+1}</em>/${N} 題　得分 <em>${score}</em>${streak>=3?`　🔥 連對 ${streak}`:""}`);
      const nx=document.getElementById('nx'); nx.disabled=false; nx.textContent=i===N-1?'看成績 →':'下一題 →'; nx.focus(); });
    document.getElementById('nx').onclick=()=>{ i++; i<N?show():endScreen(score,N,startGame); };
  }
  show();
}
let gameMap=null;
function findGame(pool){
  const N=Math.min(8,pool.length), Qs=shuffle(pool).slice(0,N); let i=0,score=0;
  gArea().innerHTML=`<div class="findq" id="fq"></div><div class="mapwrap" id="gmap"></div><div style="display:flex;gap:12px;align-items:center;margin-top:10px"><div class="fb" id="fb" style="margin:0;flex:1"></div><button class="gbtn" id="nx" disabled>下一題 →</button></div>`;
  let locked=false;
  gameMap = makeMap(document.getElementById('gmap'),{hover:false,onClick:(c)=>{
    if(locked) return; const ans=Qs[i]; locked=true; const ok=c.id===ans.id; if(ok)score++;
    gameMap.mark(c.id, ok?'hit':'miss'); if(!ok){ gameMap.mark(ans.id,'target'); gameMap.zoomTo(ans); }
    const fb=document.getElementById('fb'); fb.className='fb '+(ok?'ok':'no');
    fb.innerHTML= ok?`🎉 答對了！這裡就是${esc(ans.zh)}！`:`你點的是 ${esc(c.zh)}，${esc(ans.zh)}在閃爍的地方（${esc(ans.cont)}）`;
    setScore(`第 <em>${i+1}</em>/${N} 題　得分 <em>${score}</em>`);
    const nx=document.getElementById('nx'); nx.disabled=false; nx.textContent=i===N-1?'看成績 →':'下一題 →'; }});
  function show(){ locked=false; const ans=Qs[i]; gameMap.clear(); gameMap.reset();
    document.getElementById('fq').innerHTML=`<img src="${flagSrc(ans.id)}" alt="">請在地圖上點出 <span style="color:var(--accent)">${esc(ans.zh)}</span>`;
    document.getElementById('fb').textContent=''; document.getElementById('nx').disabled=true;
    setScore(`第 <em>${i+1}</em>/${N} 題　得分 <em>${score}</em>`); }
  document.getElementById('nx').onclick=()=>{ i++; i<N?show():endScreen(score,N,startGame); };
  show();
}
function memoryGame(pool){
  const pairs=shuffle(pool).slice(0,Math.min(6,pool.length));
  const cards=shuffle(pairs.flatMap(c=>[{id:c.id,t:'f'},{id:c.id,t:'n'}]));
  let open=[], found=0, tries=0, lock=false;
  gArea().innerHTML=`<p style="margin-bottom:12px;font-weight:700;color:var(--ink-2)">翻兩張卡片，國旗和國名一樣就配對成功！</p><div class="mem">${cards.map((c,k)=>`<button class="mcard" data-k="${k}"><div class="in"><div class="f">?</div><div class="b">${c.t==='f'?`<img src="${flagSrc(c.id)}" alt="國旗">`:esc(byId[c.id].zh)}</div></div></button>`).join('')}</div>`;
  const upd=()=>setScore(`配對 <em>${found}</em>/${pairs.length}　翻了 <em>${tries}</em> 次`); upd();
  gArea().querySelectorAll('.mcard').forEach(b=>b.onclick=()=>{
    if(lock||b.classList.contains('flip')||b.classList.contains('done')) return;
    b.classList.add('flip'); open.push(b);
    if(open.length===2){ tries++; lock=true; const [x,y]=open, cx=cards[x.dataset.k], cy=cards[y.dataset.k];
      if(cx.id===cy.id && cx.t!==cy.t){ setTimeout(()=>{x.classList.add('done');y.classList.add('done');open=[];lock=false;found++;upd();
        if(found===pairs.length) setTimeout(()=>{ gArea().insertAdjacentHTML('beforeend',`<div class="end" style="padding:20px 0"><div class="big">🎉</div><h2 style="font-size:30px">全部配對完成！翻了 ${tries} 次</h2><button class="gbtn" style="margin-top:14px" id="again">再玩一次</button></div>`); document.getElementById('again').onclick=startGame; },400); },350); }
      else setTimeout(()=>{x.classList.remove('flip');y.classList.remove('flip');open=[];lock=false;},900);
      upd(); }
  });
}

/* ========= 起始 ========= */
const h=(location.hash||'').slice(1);
if(views[h]) showView(h);
else if(byId[h]) openDetail(h,COUNTRIES);
</script>
